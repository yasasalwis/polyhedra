[package]
name        = "polyhedra_core"
version     = "0.1.0"
edition     = "2024"
description = "Polyhedra 3D geometry kernel — SDF-based"
license     = "LGPL-2.1-or-later"
repository  = "https://github.com/yourusername/polyhedra"
keywords    = ["3d", "cad", "geometry", "sdf", "modeling"]
categories  = ["graphics", "science", "rendering"]

# ── Library (Python extension + Rust library) ──────────────────────────────
[lib]
name       = "_core"
crate-type = ["cdylib", "rlib"]

# ── CLI binary ─────────────────────────────────────────────────────────────
[[bin]]
name = "polyhedra"
path = "src/bin/polyhedra.rs"

# ── Dependencies ───────────────────────────────────────────────────────────
[dependencies]
# Python bindings — only when building with the `python` feature
pyo3 = { version = "0.24", optional = true }

# SIMD-accelerated linear algebra (Vec3, Mat4, Quat)
glam = { version = "0.29", features = ["bytemuck"] }

# Data parallelism — SDF evaluation uses all CPU cores
rayon = "1.10"

# Serialisation — used by GLTF exporter
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# File-system watching (--watch mode)
notify = "6"

# Ergonomic error types
thiserror = "2"

[dev-dependencies]
# Approximate float comparison in tests
approx = "0.5"

# ── Feature flags ──────────────────────────────────────────────────────────
[features]
default = []
# Enable PyO3 Python extension module.
# maturin passes this automatically; `cargo build --bin polyhedra` does NOT,
# so the CLI binary compiles without any Python dependency.
python = ["dep:pyo3", "pyo3/extension-module"]

# ── Release profile ────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto       = "thin"
