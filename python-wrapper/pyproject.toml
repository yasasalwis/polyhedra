[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name            = "polyhedra"
version         = "0.1.0"
description     = "Plain-English 3D design library — Rust-powered, Python-friendly"
readme          = { file = "../README.md", content-type = "text/markdown" }
license         = { text = "MIT" }
requires-python = ">=3.9"
authors         = [{ name = "Polyhedra Contributors" }]
keywords        = ["3d", "cad", "geometry", "modeling", "sdf", "stl", "mesh"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage      = "https://github.com/yasasalwis/polyhedra"
Repository    = "https://github.com/yasasalwis/polyhedra"
Documentation = "https://github.com/yasasalwis/polyhedra/tree/main/docs"
"Bug Tracker" = "https://github.com/yasasalwis/polyhedra/issues"
Changelog     = "https://github.com/yasasalwis/polyhedra/blob/main/CHANGELOG.md"

[tool.maturin]
# Path to the Rust crate, relative to this pyproject.toml
manifest-path = "../rust-core/Cargo.toml"
# Python source directory (contains the polyhedra/ package)
python-source = "."
# The compiled extension lands at polyhedra/_core.so (or .pyd on Windows)
module-name   = "polyhedra._core"
# Enable the PyO3 extension-module feature when maturin builds
features      = ["python"]
# Note: strip = true causes conflicts with maturin develop; strip via cargo profile instead
