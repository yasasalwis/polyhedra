name: Python CI

on:
  push:
    branches: [main, dev]
    paths:
      - "python-wrapper/**"
      - "rust-core/**"
      - ".github/workflows/ci-python.yml"
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "python-wrapper/**"
      - "rust-core/**"
      - ".github/workflows/ci-python.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Pure Python tests (no Rust extension needed) ─────────────────────────
  unit-tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run Python unit tests
        working-directory: python-wrapper
        run: python -m pytest tests/ -v --tb=short

  # ── Build wheels ──────────────────────────────────────────────────────────
  build-wheels:
    name: Wheel — ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python
          sccache: true
          manylinux: auto
          working-directory: python-wrapper

      - name: Smoke test (native targets only)
        if: matrix.target == 'x86_64'
        run: |
          pip install polyhedra --no-index --find-links python-wrapper/dist --force-reinstall
          python -c "import polyhedra; print('polyhedra', polyhedra.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python-wrapper/dist

  # ── Build source distribution ─────────────────────────────────────────────
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python-wrapper

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python-wrapper/dist

  # ── GitHub Release (only on v* tags) ────────────────────────────────────
  release:
    name: Attach wheels to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "polyhedra ${{ github.ref_name }}"
          body: |
            ## polyhedra Python package ${{ github.ref_name }}

            Install from PyPI:
            ```
            pip install polyhedra==${{ github.ref_name }}
            ```

            Or install a wheel directly from this release:
            ```
            pip install <wheel-file>.whl
            ```

            **Supported platforms:** Linux x86_64 / aarch64, macOS x86_64 / aarch64, Windows x86_64
            **Python versions:** 3.9 – 3.13
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
